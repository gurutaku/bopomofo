<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ㄅㄆㄇ 注音符號大冒險 - 兒童趣味學習遊戲</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts for Friendly Rounded Typography -->
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    /* iOS WebKit scroll smoothness */
    .smooth-scroll {
      -webkit-overflow-scrolling: touch;
    }
    /* Card flip & pop animations */
    .card-pop {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card-pop:active {
      transform: scale(0.92);
    }
    @keyframes pulse-success {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .animate-success {
      animation: pulse-success 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes shake-error {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-error {
      animation: shake-error 0.4s ease-in-out;
    }
  </style>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- Header Section -->
  <header class="bg-gradient-to-r from-amber-400 via-orange-400 to-rose-400 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-3xl">🎈</span>
        <h1 class="text-xl sm:text-2xl font-black tracking-wide">ㄅㄆㄇ 趣味大冒險</h1>
      </div>
      <div class="flex items-center space-x-2 bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-full text-sm font-bold">
        <span>⭐ 得分:</span>
        <span id="score-display" class="text-amber-200 text-lg">0</span>
      </div>
    </div>
  </header>

  <!-- Main Navigation Tabs -->
  <nav class="bg-white border-b border-amber-200 shadow-sm sticky top-[57px] z-40">
    <div class="max-w-md mx-auto flex justify-around p-2">
      <button onclick="switchTab('board')" id="tab-board" class="tab-btn flex-1 py-2 px-3 text-center rounded-xl font-bold text-sm sm:text-base bg-amber-500 text-white shadow-sm transition">
        <i class="fa-solid fa-grid-2 mr-1"></i> 注音點讀表
      </button>
      <button onclick="switchTab('quiz')" id="tab-quiz" class="tab-btn flex-1 py-2 px-3 text-center rounded-xl font-bold text-sm sm:text-base text-amber-700 hover:bg-amber-100 transition">
        <i class="fa-solid fa-volume-high mr-1"></i> 聽音大挑戰
      </button>
      <button onclick="switchTab('picture')" id="tab-picture" class="tab-btn flex-1 py-2 px-3 text-center rounded-xl font-bold text-sm sm:text-base text-amber-700 hover:bg-amber-100 transition">
        <i class="fa-solid fa-image mr-1"></i> 看圖對對碰
      </button>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="max-w-4xl mx-auto w-full px-4 py-6 flex-grow flex flex-col justify-center">

    <!-- 1. 注音點讀表 Mode -->
    <section id="mode-board" class="space-y-6">
      <div class="bg-amber-100/70 border border-amber-200 rounded-2xl p-4 text-center">
        <p class="text-amber-800 font-bold text-sm sm:text-base">
          👉 點擊任意注音符號，聽聽發音與代表例詞！
        </p>
      </div>

      <!-- 聲母 Initial -->
      <div>
        <h2 class="text-lg font-black text-amber-800 mb-3 flex items-center">
          <span class="bg-amber-500 text-white text-xs px-2.5 py-1 rounded-full mr-2">聲母</span> 21個
        </h2>
        <div id="initials-grid" class="grid grid-cols-4 sm:grid-cols-7 gap-2.5"></div>
      </div>

      <!-- 介母 Medial -->
      <div>
        <h2 class="text-lg font-black text-teal-800 mb-3 flex items-center">
          <span class="bg-teal-500 text-white text-xs px-2.5 py-1 rounded-full mr-2">介母</span> 3個
        </h2>
        <div id="medials-grid" class="grid grid-cols-3 sm:grid-cols-7 gap-2.5"></div>
      </div>

      <!-- 韻母 Final -->
      <div>
        <h2 class="text-lg font-black text-rose-800 mb-3 flex items-center">
          <span class="bg-rose-500 text-white text-xs px-2.5 py-1 rounded-full mr-2">韻母</span> 13個
        </h2>
        <div id="finals-grid" class="grid grid-cols-4 sm:grid-cols-7 gap-2.5"></div>
      </div>
    </section>

    <!-- 2. 聽音大挑戰 Mode -->
    <section id="mode-quiz" class="hidden space-y-6 max-w-lg mx-auto w-full">
      <div class="bg-white rounded-3xl p-6 shadow-xl border-4 border-amber-300 text-center space-y-6 relative overflow-hidden">
        <div class="bg-amber-100 text-amber-800 py-2 px-4 rounded-full text-xs sm:text-sm font-bold inline-block">
          聽語音，選出正確的注音符號！
        </div>

        <!-- Big Audio Button -->
        <div class="py-4">
          <button onclick="playQuizSound()" id="quiz-audio-btn" class="w-28 h-28 bg-gradient-to-tr from-amber-400 to-orange-400 hover:from-amber-500 hover:to-orange-500 text-white rounded-full shadow-lg mx-auto flex flex-col justify-center items-center active:scale-95 transition transform border-4 border-white">
            <i class="fa-solid fa-volume-high text-4xl mb-1 animate-pulse"></i>
            <span class="text-xs font-bold">點我發音</span>
          </button>
        </div>

        <!-- Options Grid -->
        <div id="quiz-options" class="grid grid-cols-2 gap-4"></div>

        <!-- Feedback Message -->
        <div id="quiz-feedback" class="min-h-[32px] text-lg font-black flex items-center justify-center"></div>
      </div>
    </section>

    <!-- 3. 看圖對對碰 Mode -->
    <section id="mode-picture" class="hidden space-y-6 max-w-lg mx-auto w-full">
      <div class="bg-white rounded-3xl p-6 shadow-xl border-4 border-rose-300 text-center space-y-6">
        <div class="bg-rose-100 text-rose-800 py-2 px-4 rounded-full text-xs sm:text-sm font-bold inline-block">
          看圖片與例詞，猜猜看是什麼注音呢？
        </div>

        <!-- Picture & Word Display -->
        <div class="py-4 flex flex-col items-center">
          <div id="pic-emoji" class="text-7xl mb-2 filter drop-shadow-md transform hover:scale-110 transition cursor-pointer" onclick="speakCurrentPicWord()">🍎</div>
          <div id="pic-word" class="text-2xl font-black text-slate-700 tracking-wider">蘋果</div>
        </div>

        <!-- Picture Options Grid -->
        <div id="picture-options" class="grid grid-cols-2 gap-4"></div>

        <!-- Feedback Message -->
        <div id="pic-feedback" class="min-h-[32px] text-lg font-black flex items-center justify-center"></div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-amber-100/60 border-t border-amber-200 py-3 text-center text-xs text-amber-700 font-medium">
    支援 iPhone, iPad & 電腦瀏覽器 | 語音技術：Web Speech API (繁體中文)
  </footer>

  <!-- Detail Modal -->
  <div id="detail-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-xs w-full text-center space-y-4 shadow-2xl border-4 border-amber-400 relative animate-success">
      <button onclick="closeModal()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-600 text-2xl font-bold w-8 h-8 rounded-full flex items-center justify-center">✕</button>
      
      <div id="modal-symbol" class="text-6xl font-black text-amber-500 py-2">ㄅ</div>
      <div id="modal-emoji" class="text-5xl">爸</div>
      <div id="modal-word" class="text-xl font-bold text-slate-700">爸爸</div>

      <button onclick="playModalSound()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-2xl shadow-md flex items-center justify-center gap-2">
        <i class="fa-solid fa-volume-high"></i> 再聽一次聲音
      </button>
    </div>
  </div>

  <script>
    // ㄅㄆㄇ Data Dictionary
    const zhuyinData = [
      // Initials (聲母)
      { symbol: "ㄅ", word: "爸爸", emoji: "👨", type: "initial" },
      { symbol: "ㄆ", word: "蘋果", emoji: "🍎", type: "initial" },
      { symbol: "ㄇ", word: "貓咪", emoji: "🐱", type: "initial" },
      { symbol: "ㄈ", word: "飛機", emoji: "✈️", type: "initial" },
      { symbol: "ㄉ", word: "大象", emoji: "🐘", type: "initial" },
      { symbol: "ㄊ", word: "兔子", emoji: "🐰", type: "initial" },
      { symbol: "ㄋ", word: "牛奶", emoji: "🥛", type: "initial" },
      { symbol: "ㄌ", word: "老虎", emoji: "🐯", type: "initial" },
      { symbol: "ㄍ", word: "西瓜", emoji: "🍉", type: "initial" },
      { symbol: "ㄎ", word: "恐龍", emoji: "🦖", type: "initial" },
      { symbol: "ㄏ", word: "猴子", emoji: "🐒", type: "initial" },
      { symbol: "ㄐ", word: "雞蛋", emoji: "🥚", type: "initial" },
      { symbol: "ㄑ", word: "氣球", emoji: "🎈", type: "initial" },
      { symbol: "ㄒ", word: "香蕉", emoji: "🍌", type: "initial" },
      { symbol: "ㄓ", word: "蜘蛛", emoji: "🕷️", type: "initial" },
      { symbol: "ㄔ", word: "汽車", emoji: "🚗", type: "initial" },
      { symbol: "ㄕ", word: "獅子", emoji: "🦁", type: "initial" },
      { symbol: "ㄖ", word: "日光", emoji: "☀️", type: "initial" },
      { symbol: "ㄗ", word: "子子", emoji: "🍓", type: "initial" },
      { symbol: "ㄘ", word: "刺蝟", emoji: "🦔", type: "initial" },
      { symbol: "ㄙ", word: "三明治", emoji: "🥪", type: "initial" },

      // Medials (介母)
      { symbol: "ㄧ", word: "衣服", emoji: "👕", type: "medial" },
      { symbol: "ㄨ", word: "烏龜", emoji: "🐢", type: "medial" },
      { symbol: "ㄩ", word: "金魚", emoji: "🐠", type: "medial" },

      // Finals (韻母)
      { symbol: "ㄚ", word: "鴨子", emoji: "🦆", type: "final" },
      { symbol: "ㄛ", word: "蘑菇", emoji: "🍄", type: "final" },
      { symbol: "ㄜ", word: "鵝", emoji: "🦢", type: "final" },
      { symbol: "ㄝ", word: "椰子", emoji: "🥥", type: "final" },
      { symbol: "ㄞ", word: "愛心", emoji: "❤️", type: "final" },
      { symbol: "ㄟ", word: "水", emoji: "🫗", type: "final" },
      { symbol: "ㄠ", word: "貓", emoji: "🐱", type: "final" },
      { symbol: "ㄡ", word: "海鷗", emoji: "🕊️", type: "final" },
      { symbol: "ㄢ", word: "飯糰", emoji: "🍙", type: "final" },
      { symbol: "ㄣ", word: "門", emoji: "🚪", type: "final" },
      { symbol: "ㄤ", word: "太陽", emoji: "🌞", type: "final" },
      { symbol: "ㄥ", word: "櫻桃", emoji: "🍒", type: "final" },
      { symbol: "ㄦ", word: "耳朵", emoji: "👂", type: "final" }
    ];

    let currentScore = 0;
    let currentQuizTarget = null;
    let currentPicTarget = null;
    let activeModalItem = null;

    // Speech Synthesis helper
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Stop ongoing speech
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        utterance.rate = 0.85; // Slightly slower for clarity
        utterance.pitch = 1.1; // Slightly higher pitch for child friendliness
        window.speechSynthesis.speak(utterance);
      }
    }

    // Audio synth for feedback sounds (Web Audio API)
    function playBeep(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.setValueAtTime(180, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        }
      } catch (e) {
        // Fallback silently if audio context is blocked
      }
    }

    // Render Zhuyin Board
    function renderBoard() {
      const initialsGrid = document.getElementById('initials-grid');
      const medialsGrid = document.getElementById('medials-grid');
      const finalsGrid = document.getElementById('finals-grid');

      initialsGrid.innerHTML = '';
      medialsGrid.innerHTML = '';
      finalsGrid.innerHTML = '';

      zhuyinData.forEach(item => {
        const card = document.createElement('button');
        card.className = "card-pop bg-white border-2 border-amber-200 hover:border-amber-400 rounded-2xl p-2.5 flex flex-col items-center justify-center shadow-sm active:bg-amber-100 transition focus:outline-none";
        
        let colorClass = "text-amber-600";
        if (item.type === "medial") colorClass = "text-teal-600";
        if (item.type === "final") colorClass = "text-rose-600";

        card.innerHTML = `
          <span class="text-2xl sm:text-3xl font-black ${colorClass}">${item.symbol}</span>
          <span class="text-lg mt-1">${item.emoji}</span>
          <span class="text-[10px] sm:text-xs text-slate-500 font-bold">${item.word}</span>
        `;

        card.onclick = () => showDetailModal(item);

        if (item.type === 'initial') initialsGrid.appendChild(card);
        else if (item.type === 'medial') medialsGrid.appendChild(card);
        else if (item.type === 'final') finalsGrid.appendChild(card);
      });
    }

    // Modal
    function showDetailModal(item) {
      activeModalItem = item;
      document.getElementById('modal-symbol').textContent = item.symbol;
      document.getElementById('modal-emoji').textContent = item.emoji;
      document.getElementById('modal-word').textContent = item.word;
      document.getElementById('detail-modal').classList.remove('hidden');
      
      // Speak symbol and word
      speak(`${item.symbol}，${item.word}`);
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    function playModalSound() {
      if (activeModalItem) {
        speak(`${activeModalItem.symbol}，${activeModalItem.word}`);
      }
    }

    // Tab Switching
    function switchTab(tab) {
      ['board', 'quiz', 'picture'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        const sec = document.getElementById(`mode-${t}`);
        if (t === tab) {
          btn.className = "tab-btn flex-1 py-2 px-3 text-center rounded-xl font-bold text-sm sm:text-base bg-amber-500 text-white shadow-sm transition";
          sec.classList.remove('hidden');
        } else {
          btn.className = "tab-btn flex-1 py-2 px-3 text-center rounded-xl font-bold text-sm sm:text-base text-amber-700 hover:bg-amber-100 transition";
          sec.classList.add('hidden');
        }
      });

      if (tab === 'quiz') generateQuizQuestion();
      if (tab === 'picture') generatePictureQuestion();
    }

    // --- Quiz 1: Listening Quiz ---
    function generateQuizQuestion() {
      document.getElementById('quiz-feedback').innerHTML = '';
      
      // Choose random target
      const target = zhuyinData[Math.floor(Math.random() * zhuyinData.length)];
      currentQuizTarget = target;

      // Choose 3 random wrong options
      let options = [target];
      while (options.length < 4) {
        const rand = zhuyinData[Math.floor(Math.random() * zhuyinData.length)];
        if (!options.some(o => o.symbol === rand.symbol)) {
          options.push(rand);
        }
      }

      // Shuffle options
      options.sort(() => Math.random() - 0.5);

      const optionsGrid = document.getElementById('quiz-options');
      optionsGrid.innerHTML = '';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "card-pop bg-amber-50 hover:bg-amber-100 border-2 border-amber-300 rounded-2xl py-4 text-3xl font-black text-amber-800 shadow-md active:bg-amber-200 transition";
        btn.textContent = opt.symbol;
        btn.onclick = () => checkQuizAnswer(opt.symbol, btn);
        optionsGrid.appendChild(btn);
      });

      // Play target sound after short delay
      setTimeout(() => playQuizSound(), 300);
    }

    function playQuizSound() {
      if (currentQuizTarget) {
        speak(currentQuizTarget.symbol);
      }
    }

    function checkQuizAnswer(selectedSymbol, btnElement) {
      const feedback = document.getElementById('quiz-feedback');
      
      if (selectedSymbol === currentQuizTarget.symbol) {
        playBeep('correct');
        speak("答對了！真棒！");
        feedback.innerHTML = `<span class="text-emerald-500">🎉 答對了！ +10 分</span>`;
        btnElement.classList.add('bg-emerald-200', 'border-emerald-500', 'animate-success');
        
        currentScore += 10;
        document.getElementById('score-display').textContent = currentScore;

        setTimeout(() => generateQuizQuestion(), 1200);
      } else {
        playBeep('wrong');
        speak("再試試看喔！");
        feedback.innerHTML = `<span class="text-rose-500">❌ 再試一次看看！</span>`;
        btnElement.classList.add('bg-rose-100', 'border-rose-400', 'animate-error');
      }
    }

    // --- Quiz 2: Picture Quiz ---
    function generatePictureQuestion() {
      document.getElementById('pic-feedback').innerHTML = '';

      // Choose random target
      const target = zhuyinData[Math.floor(Math.random() * zhuyinData.length)];
      currentPicTarget = target;

      document.getElementById('pic-emoji').textContent = target.emoji;
      document.getElementById('pic-word').textContent = target.word;

      // Choose 3 random wrong options
      let options = [target];
      while (options.length < 4) {
        const rand = zhuyinData[Math.floor(Math.random() * zhuyinData.length)];
        if (!options.some(o => o.symbol === rand.symbol)) {
          options.push(rand);
        }
      }

      options.sort(() => Math.random() - 0.5);

      const optionsGrid = document.getElementById('picture-options');
      optionsGrid.innerHTML = '';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "card-pop bg-rose-50 hover:bg-rose-100 border-2 border-rose-300 rounded-2xl py-4 text-3xl font-black text-rose-800 shadow-md active:bg-rose-200 transition";
        btn.textContent = opt.symbol;
        btn.onclick = () => checkPictureAnswer(opt.symbol, btn);
        optionsGrid.appendChild(btn);
      });

      speakCurrentPicWord();
    }

    function speakCurrentPicWord() {
      if (currentPicTarget) {
        speak(currentPicTarget.word);
      }
    }

    function checkPictureAnswer(selectedSymbol, btnElement) {
      const feedback = document.getElementById('pic-feedback');

      if (selectedSymbol === currentPicTarget.symbol) {
        playBeep('correct');
        speak(`答對了！${currentPicTarget.symbol}，${currentPicTarget.word}`);
        feedback.innerHTML = `<span class="text-emerald-500">🎉 太厲害了！ +10 分</span>`;
        btnElement.classList.add('bg-emerald-200', 'border-emerald-500', 'animate-success');

        currentScore += 10;
        document.getElementById('score-display').textContent = currentScore;

        setTimeout(() => generatePictureQuestion(), 1400);
      } else {
        playBeep('wrong');
        speak("加油，再想想看！");
        feedback.innerHTML = `<span class="text-rose-500">❌ 再試一次看看！</span>`;
        btnElement.classList.add('bg-rose-100', 'border-rose-400', 'animate-error');
      }
    }

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      renderBoard();
    });
  </script>
</body>
</html>
